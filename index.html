<!DOCTYPE html>
<html>
    <head>
        <title>Banco Personal</title>
        <link href="style.css" rel='stylesheet'>
    </head>
    <body id="pag-indice">
        <div id="card-intro">
            <h1><em>Bienvenido Andrik</em></h1>
            <h2>Que seccion desea consultar:</h2>
        </div>
        <br>
        <div id="card-ingreso" class="button">
            <a href="ingresos.html">           
            <h2>Ingresos Mensuales</h2>
            <p>Ve todos tus ingresos del mes</p> 
            </a> 

            <div class="abrir-menu">
                <img src="img/raphtalia.png" onclick="toggleMenu('subMenu')">
                <div class="despegable-menu" id="subMenu">
                    <form action="ingresos.html" method="post" class="input-ingre" id="ingre-form">
                        <label for="Sueldo">Sueldo:</label>
                        <input type="number" id="sueldo" name="Sueldo" placeholder="Ingrese su paga" min="1">
                        <input type="submit" value="Enviar" id="guardarSueldo">
                    </form>
                </div>
            </div>
        </div>
        <br>
        <div id="card-cajas-ahorros" class="button">
            <a href="cajas.html">
            <h2>Cajitas y metas de ahorro</h2>
            <p>Ve tus apartados y tus objetivos</p> 
            </a>

            <div class="abrir-menu">
                <img src="img/ChatGPT Image 5 may 2026, 07_40_53 p.m..png" onclick="toggleMenu('subMenu2')">
                <div class="despegable-menu" id="subMenu2">
                    <form action="cajas.html" method="post" id="caja-form">
                        <label for="Nombre">Nombre:</label>
                        <input type="text" id="nombre" name="Nombre" placeholder="Ej: Figura de Anime">

                        <label for="Descripcion">Descripcion:</label>
                        <input type="text" id="descripcion" name="Descripcion" placeholder="Ej: Ahorro para figura de anime">

                        <label for="Meta">Meta:</label>
                        <input type="number" id="meta" name="Meta" placeholder="Ej: 5,000" min="1">

                        <label for="Porcentaje">Porcentaje:</label>
                        <input type="number" id="porcentaje" name="Porcentaje" placeholder="Ej: .20% de tu dinero" step="any">

                        <input type="submit" value="Crear Cajita" id="crearCaja">
                    </form>
                </div>
            </div>
        </div>
        <br>
        <div id="card-gastos" class="button">
            <a href="gastos.html">
            <h2>Gastos del Mes</h2>
            <p>Ve tus gastos programados del mes</p> 
            </a>
            <div class="abrir-menu">
                <img src="img/ChatGPT Image 5 may 2026, 07_54_06 p.m..png" alt="" onclick="toggleMenu('subMenu3')">
                <div class="despegable-menu" id="subMenu3">
                    <form action="gastos.html" method="post">
                        <label for="gasto">Gasto:</label>
                            <input type="text" name="gasto" id="gast-nuevo" placeholder="Ingrese tipo de gasto">
                        <label for="monto">Monto:</label>
                            <input type="number" name="monto" id="monto-gas" min="1">
                            
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="metodo" value="contado" checked>
                                    <span>Contado</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="metodo" value="msi">
                                    <span>MSI</span>
                                </label>
                            </div>

                            <div id="contenedor-meses" style="display: none;">
                                <label for="cantidad-meses">¿A cuántos meses?:</label>
                                <input type="number" id="cantidad-meses" min="1" placeholder="Ej. 12">
                            </div>

                        <label for="tipo-gas">Tipo:</label>
                            <input list="tarjetas" name="tipo-gas" id="tipo-gasto">
                            <datalist id="tarjetas">
                                <option value="Nu"></option>
                                <option value="BBVA"></option>
                                <option value="Banamex"></option>
                                <option value="Sears"></option>
                                <option value="Otros"></option>
                            </datalist>
                        
                        <input type="submit" value="Enviar">
                    </form>
                </div>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
