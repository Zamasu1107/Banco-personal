<!DOCTYPE html>
<html>
    <head>
        <title>Ingresos Personales</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="pag-ingreso">
        <span><a id="regr-ingre" href="index.html">Regresar al Menu</a></span>
        <h1>Ingresos Mensuales:</h1>
        <table id="tabla-ingresos">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Ingreso</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tabla-ingresos-body">
                
            </tbody>
            <tfoot>
                <tr>
                    <th>Total Final:</th>
                    <td colspan="2" id="tabla-ingresos-foot"></td>
                </tr>
            </tfoot>
        </table>

        <button class="boton-cierre-mes" id="boton-cierre">Cierre de Mes</button>

        <br>
        <h1>Ingresos Anuales:</h1>
        <table id="tabla-ingresos-anual">
            <thead>
                <tr>
                    <th>Mes</th>
                    <th>Ingreso total</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tabla-ingresos-bodyA">
                
            </tbody>
            <tfoot>
                <tr>
                    <th>Total Final:</th>
                    <td colspan="2" id="tabla-Aingresos-foot"></td>
                </tr>
            </tfoot>
        </table>
        <script src="script.js"></script>
    </body>
</html>
